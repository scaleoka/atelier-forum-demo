<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Atelier 0.2 — Forum Workspace</title>
<style>
:root{--bg:#1d2027;--side:#252a34;--panel:#2b303b;--text:#e9e5df;--muted:#a5a9b3;--accent:#bb9c78;--border:#404651;--sidebar-width:258px;--rail-width:45px;--size:14px;--editor:116px;--radius:10px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:var(--size)/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.shell{height:100dvh;min-height:450px;display:grid;grid-template-columns:var(--sidebar-width) 5px minmax(0,1fr) var(--rail-width)}.sidebar{min-width:0;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--border)}.brand{display:flex;gap:11px;align-items:center;padding:22px 18px 20px}.brandmark{background:var(--accent);color:var(--bg);font-weight:800;border-radius:9px;width:35px;height:35px;display:grid;place-items:center;font-size:23px}.brand strong{letter-spacing:.16em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.14em}.shortcuts{padding:0 12px 15px}.shortcuts button,.group,.navchild,.profile{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:7px}.shortcuts button:hover,.group:hover,.navchild:hover,.profile:hover{background:var(--panel)}.shortcuts button{color:var(--muted)}.nav-label{padding:3px 21px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}.tree{flex:1;overflow:auto;padding:0 12px}.group{font-weight:600}.group .arrow{margin-left:auto;font-size:12px;color:var(--muted)}.children{margin:0 0 9px 16px;padding-left:11px;border-left:1px solid var(--border)}.children[hidden]{display:none}.navchild{padding:7px 9px;font-size:13px;color:var(--muted)}.navchild.active{background:var(--panel);color:var(--accent)}.tag{font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-weight:400;white-space:nowrap}.profile-wrap{border-top:1px solid var(--border);padding:10px}.profile{font-size:13px}.mini-avatar{border-radius:50%;background:#85758d;width:31px;height:31px;display:grid;place-items:center;color:white;flex-shrink:0}.profile small{display:block;color:var(--muted);font-size:11px}.resize{background:var(--border);cursor:col-resize;touch-action:none}.resize:hover{background:var(--accent)}.main{display:flex;min-width:0;flex-direction:column}.top{padding:17px 25px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;min-height:81px}.top h1{margin:2px 0 0;font-size:21px;font-weight:600}.breadcrumb{font-size:12px;color:var(--muted)}.grow{flex:1}.pill{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--muted)}.viewport{overflow:auto;flex:1;padding:22px 26px}.wrap{max-width:1100px;margin:0 auto}.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}.panel h2,.panel h3{margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:12px}.intro{color:var(--muted);margin:0 0 18px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.mini-btn{background:transparent;border:1px solid var(--border);border-radius:7px;padding:5px 9px;font-size:12px}.mini-btn:hover{border-color:var(--accent);color:var(--accent)}.forum-list{display:grid;gap:8px}.forum-item{border:1px solid var(--border);border-radius:9px;background:var(--panel);overflow:hidden}.forum-line{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border:0;padding:14px 15px}.forum-line:hover{background:color-mix(in srgb,var(--accent) 7%,var(--panel))}.forum-icon{width:39px;height:39px;border-radius:9px;background:var(--side);display:grid;place-items:center;color:var(--accent);font-size:20px}.forum-text{flex:1;min-width:0}.forum-text strong{display:block}.forum-text small{color:var(--muted)}.subforums{border-top:1px solid var(--border);padding:8px 12px 13px 66px}.subforum-link{display:block;text-align:left;background:transparent;border:0;color:var(--accent);padding:5px 0;font-size:13px}.subforum-link:hover{text-decoration:underline}.topic-link{width:100%;display:flex;gap:12px;text-align:left;background:transparent;border:0;padding:13px 14px;border-bottom:1px solid var(--border);align-items:center}.topic-link:last-child{border-bottom:0}.topic-link:hover{background:color-mix(in srgb,var(--accent) 7%,var(--panel))}.topic-link strong{display:block}.topic-link small{display:block;color:var(--muted)}.topic-icon{color:var(--accent);font-size:19px}.post{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}.post-meta{border-bottom:1px solid var(--border);background:var(--side);padding:6px 13px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.post-grid{display:grid;grid-template-columns:116px minmax(0,1fr)}.post-user{padding:13px 10px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;border-right:1px solid var(--border)}.post-avatar{display:grid;place-items:center;width:58px;height:58px;background:#514353;border:2px solid var(--border);border-radius:9px;color:#e4d8ec;font-size:27px}.post-user strong{font-size:12px;overflow-wrap:anywhere}.post-user small{font-size:10px;color:var(--muted)}.post-body{min-width:0;padding:15px 17px;display:flex;flex-direction:column;gap:13px;min-height:145px}.post-text{white-space:pre-wrap;overflow-wrap:anywhere;flex:1;line-height:1.65}.post-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.post-actions button{padding:4px 7px;background:transparent;border:0;border-radius:5px;color:var(--muted);font-size:12px}.post-actions button:hover{background:var(--side);color:var(--accent)}.pin{border-left:3px solid var(--accent);padding:8px 11px;margin-bottom:13px;background:var(--panel);font-size:12px}.composer{border-top:1px solid var(--border);padding:12px 26px 16px}.composer-inner{max-width:1100px;margin:auto}.compose-box{border:1px solid var(--border);background:var(--panel);border-radius:var(--radius);overflow:hidden}.compose-head{padding:7px 12px;background:var(--side);font-size:12px;color:var(--muted)}.compose-box textarea{display:block;width:100%;height:var(--editor);min-height:65px;max-height:320px;resize:vertical;background:transparent;border:0;padding:10px 12px;color:var(--text)}.compose-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 10px}.primary{background:var(--accent);color:var(--bg);border:0;border-radius:7px;padding:8px 14px;font-weight:650}.primary:hover{filter:brightness(1.07)}.rail{background:var(--side);border-left:1px solid var(--border);padding-top:17px;display:flex;flex-direction:column;align-items:center}.gear{display:grid;place-items:center;width:34px;height:34px;background:var(--panel);border:1px solid var(--border);border-radius:9px;color:var(--accent);font-size:20px}.gear:hover{border-color:var(--accent)}.settings-cover{position:fixed;inset:0;background:#0008;display:none;justify-content:flex-end;z-index:20}.settings-cover.open{display:flex}.settings-pane{width:min(375px,100%);height:100%;overflow:auto;background:var(--side);padding:23px;box-shadow:-10px 0 30px #0006}.setting{padding:12px 0;border-bottom:1px solid var(--border)}.setting label{display:flex;justify-content:space-between;gap:8px;align-items:center}.setting input[type=color]{width:48px;height:32px;border:0;background:transparent}.setting input[type=range]{width:100%;margin-top:10px;accent-color:var(--accent)}.search{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:8px;width:100%}.notice{padding:13px 16px;background:var(--panel);border-left:3px solid var(--accent);border-radius:6px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px}.card strong{display:block;margin-bottom:6px}.hide{display:none!important}.back{border:0;background:transparent;color:var(--accent);padding:0 0 14px}.back:hover{text-decoration:underline}.inline-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.inline-actions button{border:1px solid var(--border);background:var(--panel);border-radius:7px;padding:7px 10px}.inline-actions button:hover{border-color:var(--accent)}.pinhead{margin:0 0 12px;border:1px solid var(--accent);border-radius:8px;padding:12px;background:var(--panel)}.pinhead p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.editbox{width:100%;min-height:130px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:10px}.forum-note{margin-bottom:16px}.badge{font-size:11px;padding:3px 7px;border-radius:6px;background:var(--side);color:var(--accent)}@media(max-width:750px){.shell{grid-template-columns:0 0 minmax(0,1fr) 42px}.sidebar,.resize{display:none}.top{padding:14px}.viewport{padding:14px}.composer{padding:10px}.post-grid{grid-template-columns:82px minmax(0,1fr)}.post-user{padding:9px 4px}.post-avatar{width:43px;height:43px;font-size:20px}.post-body{padding:10px;min-height:110px}.top h1{font-size:17px}}
</style></head><body>
<div class="shell"><aside class="sidebar"><div class="brand"><span class="brandmark">◈</span><div><strong>ATELIER</strong><small>FORUM WORKSPACE · 0.2</small></div></div><div class="shortcuts"><button id="plugins">◇ &nbsp; Плагины <span class="small muted">· позже</span></button><button id="search">⌕ &nbsp; Поиск</button></div><div class="nav-label">Пространства</div><nav class="tree" id="tree"></nav><div class="profile-wrap"><button class="profile" id="profile"><span class="mini-avatar">Я</span><span><b>Мой профиль</b><small>Локальный пользователь</small></span></button></div></aside><div class="resize" id="resize" title="Изменить ширину левой панели"></div><main class="main"><header class="top"><div><div class="breadcrumb" id="crumb"></div><h1 id="title"></h1></div><span class="grow"></span><span class="pill" id="visibility"></span></header><div class="viewport" id="viewport"><div class="wrap" id="content"></div></div><footer class="composer" id="composer"></footer></main><aside class="rail"><button class="gear" id="gear" aria-label="Оформление и размеры" title="Оформление и размеры">⚙</button></aside></div>
<div class="settings-cover" id="settingsCover"><section class="settings-pane" role="dialog" aria-modal="true" aria-label="Оформление"><div class="row between"><h2>Оформление</h2><button class="mini-btn" id="close">✕</button></div><p class="small muted">Изменения сразу видны и сохраняются локально.</p><div id="settings"></div><div class="inline-actions" style="margin-top:20px"><button id="resetAppearance">Сбросить оформление</button><button id="resetAll">Очистить демоданные</button></div></section></div>
<script>
(()=>{'use strict';const KEY='atelier-forum-local-v2';const defaults={bg:'#1d2027',side:'#252a34',panel:'#2b303b',text:'#e9e5df',muted:'#a5a9b3',accent:'#bb9c78',sidebarWidth:258,railWidth:45,size:14,editor:116,expanded:['forum'],openSubforums:['stories'],active:'forum',location:'index',thread:'general',drafts:{},posts:[],notes:'',pin:true,collapsedHeader:false};let s={...defaults};try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');s={...defaults,...saved,drafts:saved.drafts||{},posts:Array.isArray(saved.posts)?saved.posts:[]}}catch(e){}const $=x=>document.getElementById(x),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const forums=[{id:'general',title:'Общая беседа',description:'Открытое общение обо всём',topics:[{id:'general',title:'Главное обсуждение',subtitle:'Одна общая лента сообщений'},{id:'ideas',title:'Идеи и предложения',subtitle:'Идеи по развитию пространства'}],sub:[]},{id:'stories',title:'Истории и творчество',description:'Обсуждения, истории и миры',topics:[{id:'stories',title:'Творческая беседа',subtitle:'Разговоры о сюжетах'}],sub:[{id:'characters',title:'Персонажи',topics:[{id:'characters',title:'Галерея персонажей',subtitle:'Обсуждения персонажей'}]},{id:'world',title:'Миры',topics:[{id:'world',title:'Устройство миров',subtitle:'Лор и идеи'}]}]}];const seed={general:[{id:'a',author:'Admin',role:'Администратор',info:'Участник · онлайн',text:'Добро пожаловать в главное обсуждение. Здесь можно общаться в одной общей ленте, отвечать и цитировать сообщения.',time:'22.10.2026, 14:51'},{id:'b',author:'Мира',role:'Участник',info:'Любит долгие истории',text:'Мне нравится идея одного обсуждения без десятков отдельных тем.',time:'22.10.2026, 15:42'}],ideas:[{id:'c',author:'Admin',role:'Администратор',info:'Участник · онлайн',text:'Здесь собираем предложения к будущему движку.',time:'22.10.2026, 14:55'}],stories:[{id:'d',author:'Мира',role:'Участник',info:'Любит долгие истории',text:'Место для разговоров о сюжетах.',time:'22.10.2026, 15:10'}],characters:[],world:[]};const flat=forums.flatMap(f=>[f,...f.sub]);const threadDefs=flat.flatMap(f=>f.topics.map(t=>({...t,forum:f.id,forumTitle:f.title})));let editing=null;function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){console.warn('Storage disabled',e)}}function apply(){for(const k of ['bg','side','panel','text','muted','accent'])document.documentElement.style.setProperty('--'+k,s[k]);for(const [k,v] of Object.entries({'sidebar-width':s.sidebarWidth,'rail-width':s.railWidth,size:s.size,editor:s.editor}))document.documentElement.style.setProperty('--'+k,v+'px')}
function navigate(page,loc='index',thread){s.active=page;s.location=loc;if(thread)s.thread=thread;editing=null;save();render();$('viewport').scrollTop=0}function nav(){const data=[['forum','▤','Обсуждения','Публично',['Форумы']],['library','▧','Библиотека','Личное',['Материалы','Избранное']],['workspace','▦','Моё пространство','Личное',['Моя доска','Заметки']],['tools','◇','Инструменты','Личное',['Расширения']]];$('tree').innerHTML=data.map(([id,icon,name,tag,children])=>`<div><button class="group" data-expand="${id}" aria-expanded="${s.expanded.includes(id)}"><span>${icon}</span><span style="flex:1">${name}</span><span class="tag">${tag}</span><span class="arrow">${s.expanded.includes(id)?'⌄':'›'}</span></button><div class="children" ${s.expanded.includes(id)?'':'hidden'}>${children.map((child,i)=>`<button class="navchild ${s.active===id?'active':''}" data-nav="${id}" data-child="${i}">${esc(child)}</button>`).join('')}</div></div>`).join('');$('tree').querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>{const id=b.dataset.expand;s.expanded=s.expanded.includes(id)?s.expanded.filter(x=>x!==id):[...s.expanded,id];save();nav()});$('tree').querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));}
function forumIndex(){return `<p class="intro">Форумный модуль · открытые категории и вложенные форумы. Внутри каждой темы — общая лента сообщений.</p><div class="forum-list">${forums.map(f=>`<section class="forum-item"><button class="forum-line" data-forum="${f.id}"><span class="forum-icon">▤</span><span class="forum-text"><strong>${esc(f.title)}</strong><small>${esc(f.description)} · ${f.topics.length} тем${f.sub.length?' · '+f.sub.length+' подфорума':''}</small></span><span class="muted">Открыть →</span></button>${f.sub.length?`<div class="subforums"><div class="row between"><span class="small muted">Подфорумы</span><button class="mini-btn" data-toggle-sub="${f.id}">${s.openSubforums.includes(f.id)?'Свернуть':'Развернуть'}</button></div>${s.openSubforums.includes(f.id)?f.sub.map(sub=>`<button class="subforum-link" data-forum="${sub.id}">↳ ${esc(sub.title)} · ${sub.topics.length} тема</button>`).join(''):''}</div>`:''}</section>`).join('')}</div>`}
function topics(id){const f=flat.find(x=>x.id===id)||forums[0];return `<button class="back" data-back="index">← Все форумы</button><p class="intro">${esc(f.description||'Вложенный форум')} · Темы открываются как ленты сообщений.</p><div class="panel" style="padding:0">${f.topics.map(t=>`<button class="topic-link" data-thread="${t.id}"><span class="topic-icon">▤</span><span style="flex:1"><strong>${esc(t.title)}</strong><small>${esc(t.subtitle)}</small></span><span class="muted small">Открыть →</span></button>`).join('')}</div>${f.sub.length?`<div class="panel"><h3>Подфорумы</h3>${f.sub.map(sub=>`<button class="subforum-link" data-forum="${sub.id}">↳ ${esc(sub.title)}</button>`).join('')}</div>`:''}`}
function allPosts(t){return [...(seed[t]||[]),...s.posts.filter(p=>p.thread===t)]}function postCard(p,index){const mine=p.author==='Вы';return `<article class="post" data-post="${esc(p.id)}"><div class="post-meta"><span>${esc(p.time)}</span><span>#${index+1}</span></div><div class="post-grid"><div class="post-user"><div class="post-avatar" aria-label="Аватар">${esc(p.author[0]||'?')}</div><strong>${esc(p.author)}</strong><small>${esc(p.role||'Участник')}</small><small>${esc(p.info||'Локальный пользователь')}</small></div><div class="post-body">${editing===p.id?`<textarea class="editbox" id="editingText"></textarea><div class="post-actions"><button data-save-edit="${esc(p.id)}">Сохранить</button><button data-cancel-edit>Отмена</button></div>`:`<div class="post-text">${esc(p.text)}</div><div class="post-actions"><button data-reply="${esc(p.id)}">Ответить</button><button data-quote="${esc(p.id)}">Цитировать</button><button data-tap="${esc(p.id)}" title="Шуточная реакция">Ударить ${p.taps?'· '+p.taps:''}</button>${mine?`<button data-edit="${esc(p.id)}">Редактировать</button><button data-delete="${esc(p.id)}">Удалить</button>`:''}</div>`}</div></div></article>`}
function threadView(id){const t=threadDefs.find(x=>x.id===id)||threadDefs[0],posts=allPosts(id);return `<button class="back" data-forum="${t.forum}">← ${esc(t.forumTitle)}</button>${id==='general'&&s.pin?`<div class="pinhead"><span class="badge">📌 Закреплённая шапка</span><p>Добро пожаловать! Это демонстрация фиксированной шапки над лентой сообщений. Позже её сможет задавать модератор.</p></div>`:''}<div class="row between forum-note"><span class="small muted">${posts.length} сообщений · локальная демонстрация</span>${id==='general'?`<button class="mini-btn" id="pinToggle">${s.pin?'Скрыть закреплённую шапку':'Показать шапку'}</button>`:''}</div>${posts.length?posts.map(postCard).join(''):'<div class="notice">В этой теме пока нет сообщений. Можно написать первое.</div>'}`}
function privateView(){if(s.active==='library')return `<div class="notice">🔒 Личная библиотека. В будущей версии доступ будет только владельцу аккаунта. Сейчас данные хранятся локально.</div><div class="cards" style="margin-top:16px"><div class="card"><strong>Материалы</strong><span class="muted small">Статьи и страницы — позже</span></div><div class="card"><strong>Избранное</strong><span class="muted small">Сохранённые материалы — позже</span></div></div>`;if(s.active==='workspace')return `<div class="notice">🔒 Моё пространство · персональная область, не видимая другим пользователям в будущей версии.</div><div class="panel" style="margin-top:16px"><h3>Личные заметки</h3><textarea id="notes" class="editbox" placeholder="Локальные заметки...">${esc(s.notes)}</textarea><div class="small muted">Сохраняется в браузере по мере ввода.</div></div><div class="cards"><div class="card"><strong>Моя доска</strong><span class="small muted">Перемещаемые виджеты — в будущих версиях</span></div><div class="card"><strong>Черновики</strong><span class="small muted">Отдельная персональная коллекция — позже</span></div></div>`;return '<div class="notice">🔒 Инструменты и плагины будут отдельным приватным модулем. Настройки цветов, шрифтов и размеров теперь находятся исключительно в правой панели ⚙.</div>'}
function render(){nav();const forum=s.active==='forum';let title='';if(forum){title=s.location==='index'?'Обсуждения':s.location==='topics'?(flat.find(f=>f.id===s.thread)||forums[0]).title:(threadDefs.find(t=>t.id===s.thread)||threadDefs[0]).title}else title={library:'Библиотека',workspace:'Моё пространство',tools:'Инструменты'}[s.active]||'Обсуждения';$('title').textContent=title;$('crumb').textContent=forum?'Публичная зона / '+(s.location==='index'?'Форумы':s.location==='topics'?'Раздел':'Тема'):'Приватная зона / Личное';$('visibility').textContent=forum?'◎ Публичный модуль (план)':'♧ Приватный модуль (план)';$('content').innerHTML=forum?(s.location==='index'?forumIndex():s.location==='topics'?topics(s.thread):threadView(s.thread)):privateView();$('content').querySelectorAll('[data-forum]').forEach(b=>b.onclick=()=>navigate('forum','topics',b.dataset.forum));$('content').querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>navigate('forum','thread',b.dataset.thread));$('content').querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>navigate('forum'));$('content').querySelectorAll('[data-toggle-sub]').forEach(b=>b.onclick=()=>{let id=b.dataset.toggleSub;s.openSubforums=s.openSubforums.includes(id)?s.openSubforums.filter(x=>x!==id):[...s.openSubforums,id];save();render()});if($('pinToggle'))$('pinToggle').onclick=()=>{s.pin=!s.pin;save();render()};if($('notes'))$('notes').oninput=e=>{s.notes=e.target.value;save()};if(forum&&s.location==='thread')bindPosts();composer()}
function bindPosts(){const posts=allPosts(s.thread);for(const attr of ['reply','quote'])$('content').querySelectorAll('[data-'+attr+']').forEach(b=>b.onclick=()=>{const p=posts.find(p=>p.id===b.dataset[attr]);const input=$('message');if(!p||!input)return;input.value=attr==='quote'?`> ${p.author}: ${p.text.split('\n').join('\n> ')}\n\n`:`@${p.author} `;s.drafts[s.thread]=input.value;save();input.focus()});$('content').querySelectorAll('[data-tap]').forEach(b=>b.onclick=()=>{const id=b.dataset.tap;let p=s.posts.find(x=>x.id===id);if(!p){const q=Object.values(seed).flat().find(x=>x.id===id);if(q){p={...q,thread:s.thread,taps:0};/* demo reaction for seeded posts held separately */s.reactions=s.reactions||{};s.reactions[id]=(s.reactions[id]||0)+1;save();b.textContent='Ударить · '+s.reactions[id];return}}if(p){p.taps=(p.taps||0)+1;save();b.textContent='Ударить · '+p.taps}});$('content').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;render();const p=s.posts.find(x=>x.id===editing);if($('editingText')&&p){$('editingText').value=p.text;$('editingText').focus()}});$('content').querySelectorAll('[data-save-edit]').forEach(b=>b.onclick=()=>{const p=s.posts.find(x=>x.id===b.dataset.saveEdit),v=$('editingText').value.trim();if(p&&v){p.text=v;editing=null;save();render()}});$('content').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Удалить своё сообщение?')){s.posts=s.posts.filter(p=>p.id!==b.dataset.delete);save();render()}});$('content').querySelectorAll('[data-cancel-edit]').forEach(b=>b.onclick=()=>{editing=null;render()});$('content').querySelectorAll('[data-tap]').forEach(b=>{const id=b.dataset.tap;if(s.reactions?.[id])b.textContent='Ударить · '+s.reactions[id]})}
function composer(){const el=$('composer');if(s.active==='forum'&&s.location==='thread'){el.innerHTML=`<div class="composer-inner"><div class="compose-box"><div class="compose-head">✎ Ответ в тему · изменение высоты за нижнюю границу поля</div><textarea id="message" placeholder="Написать сообщение..."></textarea><div class="compose-foot"><span class="small muted">Локальная публикация, не видна другим</span><button class="primary" id="send">Опубликовать</button></div></div></div>`;const area=$('message');area.value=s.drafts[s.thread]||'';area.oninput=()=>{s.drafts[s.thread]=area.value;save()};$('send').onclick=()=>{const value=area.value.trim();if(!value)return;s.posts.push({id:'p'+Date.now()+Math.random().toString(36).slice(2,7),thread:s.thread,author:'Вы',role:'Участник',info:'Мой профиль',text:value,time:new Date().toLocaleString('ru-RU')});s.drafts[s.thread]='';save();render();$('viewport').scrollTop=$('viewport').scrollHeight};}else{el.innerHTML=`<div class="composer-inner"><input class="search" id="searchInput" placeholder="Поиск по форумам и модулям (демо)..." type="search" aria-label="Поиск"><div id="searchHint" class="small muted"></div></div>`;$('searchInput').oninput=e=>{const q=e.target.value.toLowerCase().trim(),hits=[...flat.map(f=>f.title),'Библиотека','Моё пространство','Инструменты'].filter(t=>t.toLowerCase().includes(q));$('searchHint').textContent=q?hits.length?'Найдено: '+hits.join(' · '):'Совпадений нет':''};}}
function settings(){const labels={bg:'Фон',side:'Боковая панель',panel:'Карточки сообщений',text:'Текст',muted:'Вторичный текст',accent:'Акцент'};let html=Object.entries(labels).map(([k,label])=>`<div class="setting"><label>${label}<input type="color" data-color="${k}" value="${s[k]}"></label></div>`).join('');for(const [key,label,min,max] of [['sidebarWidth','Ширина левой панели',185,410],['railWidth','Ширина правой панели',42,90],['size','Размер шрифта',12,20],['editor','Высота поля ответа',75,260]])html+=`<div class="setting"><label>${label}<output id="out-${key}">${s[key]} px</output></label><input type="range" data-range="${key}" min="${min}" max="${max}" value="${s[key]}"></div>`;$('settings').innerHTML=html;$('settings').querySelectorAll('[data-color]').forEach(i=>i.oninput=()=>{s[i.dataset.color]=i.value;save();apply()});$('settings').querySelectorAll('[data-range]').forEach(i=>i.oninput=()=>{s[i.dataset.range]=+i.value;$('out-'+i.dataset.range).textContent=i.value+' px';save();apply()})}function closeSettings(){$('settingsCover').classList.remove('open')};$('gear').onclick=()=>{$('settingsCover').classList.add('open');settings()};$('close').onclick=closeSettings;$('settingsCover').onclick=e=>{if(e.target===$('settingsCover'))closeSettings()};document.onkeydown=e=>{if(e.key==='Escape')closeSettings()};$('resetAppearance').onclick=()=>{for(const k of ['bg','side','panel','text','muted','accent','sidebarWidth','railWidth','size','editor'])s[k]=defaults[k];apply();save();settings()};$('resetAll').onclick=()=>{if(!confirm('Удалить все локальные сообщения, заметки и настройки версии 0.2?'))return;localStorage.removeItem(KEY);s={...defaults,drafts:{},posts:[],expanded:['forum'],openSubforums:['stories']};apply();render();settings()};$('plugins').onclick=()=>navigate('tools');$('search').onclick=()=>{navigate('library');$('searchInput')?.focus()};$('profile').onclick=()=>alert('Регистрация и публичные профили появятся после подключения backend.');const resizer=$('resize');let drag=false;resizer.onpointerdown=e=>{drag=true;resizer.setPointerCapture(e.pointerId)};resizer.onpointermove=e=>{if(drag){s.sidebarWidth=Math.min(410,Math.max(185,e.clientX));apply()}};resizer.onpointerup=()=>{drag=false;save()};resizer.onpointercancel=()=>{drag=false};apply();render();})();
</script></body></html>
